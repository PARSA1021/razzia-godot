<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Jazz House: Piano Keyboard -->
  <g transform="translate(4, 12)">
    <!-- Base Frame / White Keys (5 keys) -->
    <rect x="0" y="0" width="56" height="40" rx="3" fill="#ffffff" />
    <!-- White key separator lines -->
    <line x1="11.2" y1="0" x2="11.2" y2="40" stroke="#000000" stroke-width="1.5" />
    <line x1="22.4" y1="0" x2="22.4" y2="40" stroke="#000000" stroke-width="1.5" />
    <line x1="33.6" y1="0" x2="33.6" y2="40" stroke="#000000" stroke-width="1.5" />
    <line x1="44.8" y1="0" x2="44.8" y2="40" stroke="#000000" stroke-width="1.5" />
    <!-- Black Keys -->
    <rect x="7" y="0" width="7" height="24" rx="1" fill="#000000" />
    <rect x="19" y="0" width="7" height="24" rx="1" fill="#000000" />
    <rect x="41" y="0" width="7" height="24" rx="1" fill="#000000" />
  </g>
</svg>
