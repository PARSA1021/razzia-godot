<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Banknote Strap / Money Clip -->
  <!-- Back bill edge -->
  <rect x="8" y="16" width="48" height="28" rx="3" fill="#ffffff" opacity="0.4" />
  <!-- Front bill -->
  <rect x="6" y="20" width="48" height="28" rx="3" fill="#ffffff" />
  <!-- Bill border cutout -->
  <rect x="9" y="23" width="42" height="22" rx="2" fill="#000000" />
  <!-- Money Clip / Strap Band -->
  <rect x="25" y="18" width="14" height="32" rx="2" fill="#ffffff" />
  <!-- Dollar symbol cutout inside clip -->
  <text x="32" y="39" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#000000">$</text>
</svg>
